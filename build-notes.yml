name: Build notes.json from content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate notes.json
        run: node scripts/build-notes.js

      - name: Commit and push if notes.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notes.json
          git diff --staged --quiet || git commit -m "chore: notes.json 자동 갱신"
          git push
